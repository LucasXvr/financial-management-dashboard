services:
  api:
    build:
      context: .
      dockerfile: Fin.Api/Dockerfile
    ports:
      - "5110:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db;Database=FinancialDB;User Id=sa;Password=${SQL_SERVER_PASSWORD:?Set SQL_SERVER_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False;Connect Timeout=30
      - JwtSettings__SecretKey=${JWT_SECRET:?Set JWT_SECRET in .env}
      - FrontendUrl=http://localhost:4200
      - BackendUrl=http://localhost:5110
      - EmailSettings__Host=${SMTP_HOST:-mailpit}
      - EmailSettings__Port=${SMTP_PORT:-1025}
      - EmailSettings__FromAddress=${SMTP_FROM_ADDRESS:-no-reply@minhasfinancas.local}
      - EmailSettings__FromName=${SMTP_FROM_NAME:-Minhas Finanças}
      - EmailSettings__Username=${SMTP_USERNAME:-}
      - EmailSettings__Password=${SMTP_PASSWORD:-}
      - EmailSettings__EnableSsl=${SMTP_ENABLE_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys
    networks:
      - financial-network
    command: >
      sh -c "sleep 15 &&
             dotnet ef database update --project /src/Fin.Api --startup-project /src/Fin.Api &&
             dotnet Fin.Api.dll"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SERVER_PASSWORD:?Set SQL_SERVER_PASSWORD in .env}
      - MSSQL_PID=Express
      - MSSQL_TCP_PORT=1433
      - MSSQL_AGENT_ENABLED=true
      - MSSQL_ENABLE_HADR=0
      - MSSQL_MEMORY_LIMIT_MB=2048
      - MSSQL_TELEMETRY_ENABLED=0
    ports:
      - "1200:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - financial-network

networks:
  financial-network:
    driver: bridge

volumes:
  sqldata:
  dataprotection-keys:
