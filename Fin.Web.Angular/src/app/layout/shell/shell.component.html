<div class="shell">
  <header class="app-header">
    <div class="header-content">
      <a class="brand" routerLink="/app/dashboard" aria-label="Ir para o dashboard">
        <img src="/logotipo.png" alt="MF Finance" />
      </a>
      <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-controls="main-navigation" aria-label="Abrir menu principal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <nav id="main-navigation" [class.open]="menuOpen" aria-label="Menu principal">
        <a routerLink="/app/dashboard" routerLinkActive="active" (click)="closeMenu()">
          <svg class="filled-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"></path></svg>
          Dashboard
        </a>
        <a routerLink="/app/transactions" routerLinkActive="active" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M17 6.5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          Transações
        </a>
        <a routerLink="/app/categories" routerLinkActive="active" (click)="closeMenu()">
          <svg class="filled-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6v6H4V5Zm10 0h6v6h-6V5ZM4 15h6v4H4v-4Zm10 0h6v4h-6v-4Z"></path></svg>
          Categorias
        </a>
        <button class="theme-toggle" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.darkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'" [attr.title]="theme.darkMode() ? 'Modo claro' : 'Modo escuro'">
          <span aria-hidden="true">{{ theme.darkMode() ? '☀' : '☾' }}</span>
        </button>
        <button class="logout-button" type="button" (click)="logout()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"></path></svg>
          Sair
        </button>
      </nav>
    </div>
  </header>
  <main><router-outlet></router-outlet></main>
</div>
