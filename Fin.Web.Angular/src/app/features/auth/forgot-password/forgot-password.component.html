<section class="auth-page">
  <a class="back-link" routerLink="/login">← Voltar ao login</a>
  <button class="theme-toggle" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.darkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'">
    <span aria-hidden="true">{{ theme.darkMode() ? '☀' : '☾' }}</span>
  </button>

  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand"><img src="/icone.png" alt="" /></div>
    <div class="auth-heading">
      <h1>Recuperar senha</h1>
      <p>Informe seu email para receber o link de recuperação.</p>
    </div>

    <label for="recovery-email">Email</label>
    <input id="recovery-email" type="email" formControlName="email" placeholder="voce@empresa.com" />
    <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Informe um email válido.</small>

    <p class="error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success" role="status" *ngIf="successMessage">{{ successMessage }}</p>

    <button type="submit" [disabled]="loading || !!successMessage">
      {{ loading ? 'Enviando...' : 'Enviar link de recuperação' }}
    </button>

    <div class="auth-links"><a routerLink="/login">Voltar para entrar</a></div>
  </form>
</section>
