<section class="auth-page">
  <a class="back-link" routerLink="/login">← Voltar ao login</a>
  <button class="theme-toggle" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.darkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'">
    <span aria-hidden="true">{{ theme.darkMode() ? '☀' : '☾' }}</span>
  </button>

  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand"><img src="/icone.png" alt="" /></div>
    <div class="auth-heading">
      <h1>Definir nova senha</h1>
      <p>Crie uma nova senha para sua conta.</p>
    </div>

    <label for="new-password">Nova senha</label>
    <div class="password-field">
      <input id="new-password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Nova senha" />
      <button class="password-toggle" type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
      </button>
    </div>
    <span class="password-hint">8 caracteres, com maiúscula, minúscula, número e símbolo.</span>

    <label for="confirm-new-password">Confirmar nova senha</label>
    <div class="password-field">
      <input id="confirm-new-password" [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Repita a nova senha" />
      <button class="password-toggle" type="button" (click)="toggleConfirmPasswordVisibility()" [attr.aria-label]="showConfirmPassword ? 'Ocultar confirmação' : 'Mostrar confirmação'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
      </button>
    </div>

    <p class="error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success" role="status" *ngIf="successMessage">{{ successMessage }}</p>

    <button type="submit" [disabled]="loading || !!successMessage || !email || !token">
      {{ loading ? 'Salvando...' : 'Redefinir senha' }}
    </button>
    <div class="auth-links" *ngIf="successMessage"><a routerLink="/login">Entrar com a nova senha</a></div>
  </form>
</section>
